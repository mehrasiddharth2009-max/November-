<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>A Beautiful Moment ✨</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=Parisienne&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;

      padding: 45px 18px;

      background-color: #fffafa;

      /* Soft pink checked background */
      background-image:
        linear-gradient(45deg, #f8dfe7 25%, transparent 25%),
        linear-gradient(-45deg, #f8dfe7 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #f8dfe7 75%),
        linear-gradient(-45deg, transparent 75%, #f8dfe7 75%);

      background-size: 38px 38px;

      background-position:
        0 0,
        0 19px,
        19px -19px,
        -19px 0;

      overflow-x: hidden;
      position: relative;
    }

    /* Soft floating sparkles */
    .sparkle {
      position: fixed;
      color: rgba(191, 105, 132, 0.45);
      font-size: 18px;
      pointer-events: none;
      animation: float 5s ease-in-out infinite;
    }

    .s1 {
      top: 12%;
      left: 10%;
    }

    .s2 {
      top: 23%;
      right: 10%;
      animation-delay: 1.5s;
    }

    .s3 {
      bottom: 15%;
      left: 14%;
      animation-delay: 2.5s;
    }

    .s4 {
      bottom: 20%;
      right: 13%;
      animation-delay: 1s;
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0) rotate(0deg);
        opacity: 0.35;
      }

      50% {
        transform: translateY(-12px) rotate(8deg);
        opacity: 0.75;
      }
    }

    /* Main Polaroid */
    .polaroid {
  width: min(500px, 94vw);
  background: #ffffff;
  padding: 15px 15px 30px;
  position: relative;

  box-shadow:
    0 25px 55px rgba(87, 38, 55, 0.18),
    0 5px 15px rgba(87, 38, 55, 0.10);

  transform: rotate(-1.5deg);
  animation: entrance 1.3s ease forwards;
  border-radius: 2px;
}

.photo-frame {
  width: 100%;
  aspect-ratio: 3 / 4;

  position: relative;
  overflow: hidden;

  background: #f8eeee;

  box-shadow:
    inset 0 0 0 1px rgba(100, 50, 70, 0.04);
}

.photo-frame img {
  position: absolute;

  width: 133.333%;
  height: 100%;

  left: -16.666%;
  top: 0;

  object-fit: cover;

  transform: rotate(-90deg);
  transform-origin: center center;
}

    /* Slight paper texture */
    .polaroid::after {
      content: "";
      position: absolute;
      inset: 0;

      pointer-events: none;

      background:
        radial-gradient(
          rgba(150, 80, 100, 0.035) 1px,
          transparent 1px
        );

      background-size: 5px 5px;

      opacity: 0.35;
    }

    /* Pink tape */
    .tape {
      position: absolute;

      width: 115px;
      height: 30px;

      top: -14px;
      left: 50%;

      transform: translateX(-50%) rotate(2deg);

      background: rgba(244, 184, 202, 0.72);

      box-shadow: 0 2px 5px rgba(90, 40, 60, 0.08);

      z-index: 5;
    }

    /* Photo area */
    .photo-frame {
      width: 100%;
      aspect-ratio: 4 / 3;

      position: relative;

      overflow: hidden;

      background: #f8eeee;

      box-shadow:
        inset 0 0 0 1px rgba(100, 50, 70, 0.04);
    }

    /*
      Original image is portrait.
      It is rotated -90 degrees as requested.
    */
    .photo-frame img {
      position: absolute;

      width: 100%;
      height: 133.333%;

      left: 0;
      top: -16.666%;

      object-fit: cover;

      transform: rotate(-90deg);

      transform-origin: center center;
    }

    /* Shayari */
    .shayari {
      padding: 25px 12px 4px;

      text-align: center;

      position: relative;
      z-index: 2;
    }

    .small-line {
      width: 45px;
      height: 1px;

      margin: 0 auto 13px;

      background: #d99caf;
    }

    .shayari p {
      font-family: "Cormorant Garamond", serif;

      color: #613b49;

      font-size: 22px;

      line-height: 1.48;

      font-weight: 500;

      letter-spacing: 0.15px;
    }

    .ending {
      margin-top: 15px;

      font-family: "Parisienne", cursive;

      font-size: 24px;

      color: #b86f87;
    }

    /* Entrance animation */
    @keyframes entrance {
      0% {
        opacity: 0;
        transform:
          translateY(40px)
          rotate(-5deg)
          scale(0.96);
      }

      100% {
        opacity: 1;
        transform:
          translateY(0)
          rotate(-1.5deg)
          scale(1);
      }
    }

    /* Mobile */
    @media (max-width: 600px) {

  body {
    padding: 30px 10px;

    background-size: 32px 32px;

    background-position:
      0 0,
      0 16px,
      16px -16px,
      -16px 0;
  }

  .polaroid {
    width: 95vw;
    padding: 11px 11px 24px;
  }

  .photo-frame {
    aspect-ratio: 3 / 4;
  }

  .shayari {
    padding: 21px 7px 2px;
  }

  .shayari p {
    font-size: 20px;
    line-height: 1.46;
  }

  .ending {
    font-size: 22px;
  }
    }

      .tape {
        width: 92px;
        height: 26px;
      }

      .sparkle {
        font-size: 15px;
      }
    }

    @media (max-width: 380px) {

      .shayari p {
        font-size: 18px;
      }

      .polaroid {
        width: 94vw;
      }
    }
  </style>
</head>

<body>

  <!-- Background sparkles -->
  <div class="sparkle s1">✦</div>
  <div class="sparkle s2">✧</div>
  <div class="sparkle s3">✦</div>
  <div class="sparkle s4">✧</div>


  <!-- Polaroid -->
  <div class="polaroid">

    <div class="tape"></div>

    <div class="photo-frame">
      <img
        src="file_00000000507c821186392dbfcfa54e14.jpg"
        alt="Beautiful moment">
    </div>


    <div class="shayari">

      <div class="small-line"></div>

      <p>
        Khule baalon mein yun saadgi se baithi ho,<br>
        Jaise shaam ne khud tumhara libaas odh liya ho.<br>
        Nigahon mein khamoshi, chehre pe ek noor sa hai,<br>
        Tumhe dekho toh lagta hai, husn ko saadgi se ishq sa hai.
      </p>

      <div class="ending">✨</div>

    </div>

  </div>

</body>
</html>
