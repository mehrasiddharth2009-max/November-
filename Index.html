<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Just A Beautiful Moment ✨</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 35px 18px;

      background-color: #fffafa;

      /* Pink + white checked background */
      background-image:
        linear-gradient(45deg, #f8dce6 25%, transparent 25%),
        linear-gradient(-45deg, #f8dce6 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #f8dce6 75%),
        linear-gradient(-45deg, transparent 75%, #f8dce6 75%);

      background-size: 34px 34px;

      background-position:
        0 0,
        0 17px,
        17px -17px,
        -17px 0;

      overflow-x: hidden;
    }

    .polaroid {
      width: min(430px, 92vw);
      background: white;
      padding: 14px 14px 25px;

      box-shadow:
        0 18px 40px rgba(90, 35, 55, 0.18),
        0 4px 10px rgba(90, 35, 55, 0.08);

      transform: rotate(-1.5deg);

      position: relative;

      animation: appear 1.2s ease forwards;
    }

    /* Pink tape */
    .tape {
      position: absolute;
      width: 105px;
      height: 28px;

      background: rgba(246, 184, 204, 0.75);

      top: -13px;
      left: 50%;

      transform: translateX(-50%) rotate(2deg);

      z-index: 5;
    }

    .photo-frame {
      width: 100%;
      height: 420px;

      overflow: hidden;
      background: #f8eeee;
    }

    .photo-frame img {
      width: 100%;
      height: 100%;

      display: block;

      object-fit: cover;
      object-position: center;

      /* Photo ko correct direction me rakhne ke liye */
      transform: rotate(90deg) scale(1.02);
    }

    .shayari {
      padding: 22px 10px 2px;

      text-align: center;

      color: #633b49;
    }

    .shayari p {
      font-family: "Cormorant Garamond", serif;

      font-size: 22px;
      line-height: 1.45;

      font-weight: 500;

      letter-spacing: 0.2px;
    }

    .sparkle {
      margin-top: 13px;
      font-size: 18px;
      opacity: 0.8;
    }

    @keyframes appear {
      0% {
        opacity: 0;
        transform: translateY(30px) rotate(-4deg);
      }

      100% {
        opacity: 1;
        transform: translateY(0) rotate(-1.5deg);
      }
    }

    @media (max-width: 600px) {

      body {
        padding: 28px 14px;

        background-size: 30px 30px;

        background-position:
          0 0,
          0 15px,
          15px -15px,
          -15px 0;
      }

      .polaroid {
        width: 92vw;
        padding: 11px 11px 21px;
      }

      .photo-frame {
        height: 350px;
      }

      .shayari {
        padding: 19px 7px 0;
      }

      .shayari p {
        font-size: 20px;
        line-height: 1.42;
      }

      .tape {
        width: 90px;
        height: 25px;
      }
    }
  </style>
</head>

<body>

  <div class="polaroid">

    <div class="tape"></div>

    <div class="photo-frame">
      <img
        src="file_00000000507c821186392dbfcfa54e14.jpg"
        alt="Beautiful moment">
    </div>

    <div class="shayari">

      <p>
        Khule baalon mein yun saadgi se baithi ho,<br>
        Jaise shaam ne khud tumhara libaas odh liya ho.<br>
        Nigahon mein khamoshi, chehre pe ek noor sa hai,<br>
        Tumhe dekho toh lagta hai, husn ko saadgi se ishq sa hai.
      </p>

      <div class="sparkle">✨</div>

    </div>

  </div>

</body>
</html>
